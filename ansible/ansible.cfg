[defaults]
inventory = inventory.aws_ec2.yml
remote_user = ubuntu
private_key_file = ~/.ssh/k8s-lab
# Instance IPs get recycled on every destroy and rebuild, so a cached host key
# from a previous cluster would block the connection.
host_key_checking = False
interpreter_python = auto_silent
deprecation_warnings = False

[inventory]
# Inventory plugins are opt-in. Without this line the YAML inventory file is
# ignored and Ansible reports an empty inventory with no explanation.
enable_plugins = amazon.aws.aws_ec2

[privilege_escalation]
become = True
become_method = sudo
become_user = root
