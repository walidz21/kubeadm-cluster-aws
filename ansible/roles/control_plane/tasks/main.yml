---
- name: Initialise the control plane
  # admin.conf only exists after a successful init, so "creates" makes a repeat
  # run skip instead of failing against an existing cluster.
  #
  # --apiserver-advertise-address is the private IP the API server tells the
  #   worker to reach it on, inside the VPC.
  # --apiserver-cert-extra-sans adds the public IP to the API server
  #   certificate, without which kubectl from outside the VPC fails on a
  #   certificate name mismatch.
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --pod-network-cidr={{ pod_network_cidr }}
      --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      --apiserver-cert-extra-sans={{ ansible_host }}
    creates: /etc/kubernetes/admin.conf

- name: Create the .kube directory for the ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Install kubeconfig for the ubuntu user
  # Lets kubectl work as ubuntu rather than needing sudo on every command.
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Install the Flannel CNI
  # Flannel expects the same pod CIDR that was given to kubeadm init. A
  # mismatch leaves pods scheduled but without addresses, and the failure
  # gives no useful signal.
  ansible.builtin.command:
    cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel
  changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

- name: Remove the control plane NoSchedule taint
  # Lab choice so both nodes carry workloads and cross-node networking can be
  # exercised. Production keeps the taint.
  ansible.builtin.command:
    cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane:NoSchedule-
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: untaint
  changed_when: "'untainted' in untaint.stdout"
  # On a repeat run the taint is already gone, which is not a failure.
  failed_when: untaint.rc != 0 and 'not found' not in untaint.stderr
